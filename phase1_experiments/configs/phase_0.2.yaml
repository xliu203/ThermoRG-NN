# Phase 0.2: BN vs LN Parallel Lines Core Test
# ConvNet L=5, D ∈ {64, 256, 1024}, BN vs LN
# 6 learning rates, 3 seeds, 200 epochs

experiment:
  name: "phase_0.2_bn_ln_parallel_lines"
  description: "Core test: BN and LN should have same slope β(ln(γ))"
  
architecture:
  L: 5
  kernel_size: 3
  skip_connections: false
  activation: GELU

norm_types: ['batchnorm', 'layernorm']

D_values: [64, 256, 1024]

lr_values: [0.0001, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]

seeds: [42, 43, 44]

training:
  epochs: 200
  batch_size: 128
  optimizer: SGD
  momentum: 0.9
  weight_decay: 0.0
  scheduler: cosine

dataset:
  name: CIFAR10
  num_classes: 10

measurements:
  lambda_max_at_init: true
  lambda_max_at_stationary: true
  gamma: true
  beta: true
  stationary_check: true

output:
  save_models: false
  save_losses: true
  save_all_metrics: true
